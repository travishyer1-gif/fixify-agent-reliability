[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fixify-agent-reliability"
version = "0.1.0"
description = "Portable incident-to-guardrail reliability tooling for AI agents."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Froberto" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
fixify = "fixify_reliability.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

